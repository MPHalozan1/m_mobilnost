name: m_mobilnost
description: "M Mobilnost 2.0 - Marprom Maribor city bus mobility app."
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  shared_preferences: ^2.3.5
  hive_flutter: ^1.1.0
  qr_flutter: ^4.1.0
  screen_brightness: ^2.0.0
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  connectivity_plus: ^6.1.2
  http: ^1.2.2
  google_maps_flutter: ^2.10.0
  web: ^1.1.0
  url_launcher: ^6.3.1
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  google_sign_in: ^7.2.0
  cloud_firestore: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 900
